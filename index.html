<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gary LaDrido</title>
  <meta name="description" content="Gary LaDrido. Frontier technology, sports, energy-transition advisory, placement, RWA tokenization, venture studio." />
  <link rel="canonical" href="https://garyladrido.github.io/" />
  <meta property="og:title" content="Gary LaDrido" />
  <meta property="og:image" content="https://garyladrido.github.io/gary.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=Playfair+Display:wght@500&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#12110f; --fg:#f3eadb; --muted:#9a9084; --sun:#c4a574; --line:#2e2a24; }
    * { box-sizing:border-box; }
    html,body { margin:0; background:var(--bg); color:var(--fg); font-family:"IBM Plex Sans",system-ui,sans-serif; }
    a { color:inherit; text-decoration:none; }
    .page { max-width:42rem; margin:0 auto; padding:3.5rem 1.5rem 4rem; }
    h1 { font-family:"Playfair Display",Georgia,serif; font-weight:500; font-size:clamp(2.6rem,8vw,4rem); margin:0 0 2.5rem; }
    .tiles { display:grid; gap:0.75rem; }
    @media (min-width:640px) { .tiles { grid-template-columns:1fr 1fr; } }
    .tiles a {
      display:flex; flex-direction:column; justify-content:center; gap:0.3rem;
      min-height:88px; padding:1.1rem 1.25rem; border:1px solid var(--line);
    }
    .tiles a:hover { border-color:var(--sun); }
    .tiles span { font-size:15px; letter-spacing:.03em; }
    .tiles small { color:var(--muted); font-size:13px; }
  </style>
</head>
<body>
  <div class="page">
    <h1>Gary LaDrido</h1>
    <div class="tiles">
      <a href="https://www.redrock.ventures">
        <span>Red Rock Ventures</span>
        <small>Frontier technology investing</small>
      </a>
      <a href="https://www.dcbsportsllc.com">
        <span>DCB Sports</span>
        <small>Sports investing</small>
      </a>
      <a href="https://www.renewableadvisors.com">
        <span>Renewable Advisors</span>
        <small>Energy-transition advisory</small>
      </a>
      <a href="https://www.sustainablecapitalmarkets.com">
        <span>Sustainable Capital Markets</span>
        <small>Placement and fundraising advisory</small>
      </a>
      <a href="https://www.rialtoelysium.com">
        <span>Rialto Elysium</span>
        <small>Tokenization of real-world assets</small>
      </a>
      <a href="/kingmaker/">
        <span>Kingmaker Inc.</span>
        <small>Venture studio</small>
      </a>
    </div>
  </div>
</body>
</html>
