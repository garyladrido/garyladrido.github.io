<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ganttry AI</title>
  <meta name="description" content="Three clocks on a live data center pad. Kingmaker spin. Operator not named." />
  <link rel="canonical" href="https://garyladrido.github.io/ganttry/" />
  <style>
    :root { --bg:#0e0d0c; --fg:#f1eadf; --muted:#8f877c; --sun:#c4a574; --line:#2a2722; }
    * { box-sizing:border-box; }
    html,body { margin:0; background:var(--bg); color:var(--fg); font-family:Georgia,serif; }
    a { color:inherit; }
    .bar,.wrap { max-width:48rem; margin:0 auto; padding:1.25rem 1.5rem; }
    .bar { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line); }
    .kicker { font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--sun); font-family:system-ui,sans-serif; }
    h1 { font-weight:500; font-size:clamp(2.4rem,8vw,4.2rem); margin:1rem 0 0; }
    .hero { padding:4rem 1.5rem; max-width:48rem; margin:0 auto; }
    .muted { color:var(--muted); line-height:1.65; font-family:system-ui,sans-serif; }
    footer { border-top:1px solid var(--line); font-size:12px; color:var(--muted); font-family:system-ui,sans-serif; }
  </style>
</head>
<body>
  <header class="bar">
    <p class="kicker" style="margin:0">Ganttry AI</p>
    <a href="../kingmaker/" class="muted" style="text-decoration:none">Kingmaker</a>
  </header>
  <section class="hero">
    <p class="kicker">Kingmaker spin · ganttry.ai · Operator not named</p>
    <h1>Three clocks on a live pad.</h1>
    <p class="muted" style="max-width:36rem;font-size:1.125rem;margin-top:2rem">Workflow of the job, not a pretty Gantt. Heavy gear, crane windows, OEM slots. Domain ganttry.ai.</p>
  </section>
  <footer><div class="wrap"><p>A Kingmaker Inc. company. Chairman Gary LaDrido. Chair not filled. Not Red Rock.</p></div></footer>
</body>
</html>
